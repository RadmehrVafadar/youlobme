<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You lob me?</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main aria-label="You lob me?">
      <div id="cat">
        <p id="question">you lob me?</p>
        <img id="picture" src="src/assets/cats/cat1.png" alt="Cat 1">
        <button id="again" type="button" hidden>again</button>
        <p id="status" role="status" hidden></p>
      </div>
      <button id="yes" type="button">Yes</button>
      <button id="no" type="button">No</button>
    </main>
    <div id="volume-controls" aria-label="Volume controls">
      <label for="music-volume">Background</label>
      <input id="music-volume" type="range" min="0" max="100" value="85" aria-valuetext="85%">
      <label for="voice-volume">Lob me</label>
      <input id="voice-volume" type="range" min="0" max="150" value="110" aria-valuetext="110%">
    </div>
    <audio id="audio" src="src/assets/lobme_mp4/youlobme1.m4a" preload="auto"></audio>
    <audio id="music" src="src/assets/backgroundMusic/cat_happy_backgroundmusic.mp3" preload="auto" loop></audio>
  </body>
</html>
